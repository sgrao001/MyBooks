
name: Run Python Script

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  run-my-script:
    runs-on: ubuntu-latest
    steps: # This must be exactly 4 spaces in (aligned with runs-on)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the script
        run: python hello.py
