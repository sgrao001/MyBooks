<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Upload</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; border-radius: 5px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>📤 Anonymous File Upload</h1>
    <p>Select a file – it will be saved permanently to this repository.</p>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <div id="result"></div>

    <script>
        const WORKER_URL = 'https://upload-api.sgrao001.workers.dev'; // your worker URL

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            if (!fileInput.files.length) {
                resultDiv.innerHTML = '❌ Select a file first';
                resultDiv.className = 'error';
                return;
            }
            const file = fileInput.files[0];
            resultDiv.innerHTML = '📤 Uploading...';
            resultDiv.className = '';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: formData   // no Content-Type header needed – browser sets correct multipart boundary
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    resultDiv.innerHTML = `✅ Success!<br>Issue: <a href="${data.issueUrl}" target="_blank">${data.issueUrl}</a>`;
                    resultDiv.className = 'success';
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (err) {
                resultDiv.innerHTML = `❌ Error: ${err.message}`;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
